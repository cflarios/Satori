<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Satori">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bladeAlt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="enso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.4" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Enso: open brush circle -->
  <circle cx="120" cy="120" r="96" fill="none" stroke="url(#enso)" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="520 603" transform="rotate(128 120 120)"/>

  <!-- Iris / 6-blade aperture -->
  <g>
    <path id="bl" d="M182,120 A62,62 0 0,0 151,66.31 L140,120 Z" fill="url(#blade)"/>
    <use href="#bl" transform="rotate(60 120 120)" fill="url(#bladeAlt)"/>
    <use href="#bl" transform="rotate(120 120 120)"/>
    <use href="#bl" transform="rotate(180 120 120)" fill="url(#bladeAlt)"/>
    <use href="#bl" transform="rotate(240 120 120)"/>
    <use href="#bl" transform="rotate(300 120 120)" fill="url(#bladeAlt)"/>
  </g>

  <!-- Spark of insight -->
  <g filter="url(#glow)">
    <path d="M120,98 L122.6,117.4 L142,120 L122.6,122.6 L120,142 L117.4,122.6 L98,120 L117.4,117.4 Z"
          fill="url(#spark)"/>
    <circle cx="120" cy="120" r="4" fill="#fffbeb"/>
  </g>
</svg>
