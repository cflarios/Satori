<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satori — quizzes</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <img src="logo.svg" alt="" class="logo" width="48" height="48">
        <h1>Satori</h1>
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
      <p>Point the camera at the quiz and capture — Claude solves it.</p>
    </header>

    <div id="settings-backdrop" class="settings-backdrop" hidden></div>
    <aside id="settings" class="settings-panel" aria-hidden="true">
      <div class="settings-head">
        <h2>Settings</h2>
        <button id="btn-settings-close" class="icon-btn" type="button" aria-label="Close settings" title="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
      <form id="settings-form" autocomplete="off">
        <fieldset>
          <legend>Model</legend>
          <label>Anthropic API key
            <input type="password" id="cfg-apikey" autocomplete="off" placeholder="sk-ant-…">
          </label>
          <p class="hint" id="apikey-hint"></p>
        </fieldset>
        <fieldset>
          <legend>MQTT — send answers to an ESP32 (optional)</legend>
          <label>Broker host
            <input id="cfg-broker" autocomplete="off" placeholder="192.168.1.21 (empty = disabled)">
          </label>
          <div class="row2">
            <label>Port <input id="cfg-port" type="number" min="1" max="65535" placeholder="1883"></label>
            <label>QoS
              <select id="cfg-qos"><option value="0">0</option><option value="1">1</option></select>
            </label>
          </div>
          <label>Topic <input id="cfg-topic" autocomplete="off" placeholder="satori/answers"></label>
          <label>Username <input id="cfg-user" autocomplete="off" placeholder="(anonymous)"></label>
          <label>Password <input type="password" id="cfg-pass" autocomplete="off"></label>
          <p class="hint" id="pass-hint"></p>
        </fieldset>
        <div class="settings-actions">
          <button type="submit">Save</button>
          <span id="settings-status" class="status" hidden></span>
        </div>
      </form>
    </aside>

    <section class="camera-panel">
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div id="camera-off" class="camera-off">Camera off</div>
      </div>
      <div class="controls">
        <button id="btn-camera" type="button">Turn on camera</button>
        <button id="btn-capture" type="button" disabled>Capture and solve</button>
        <label class="upload-label">
          or upload a photo
          <input id="file-input" type="file" accept="image/*">
        </label>
      </div>
      <p id="status" class="status" hidden></p>
    </section>

    <section id="results" class="results" hidden>
      <h2>Answers</h2>
      <div id="warnings"></div>
      <div id="answers"></div>
    </section>
  </main>
  <canvas id="canvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
